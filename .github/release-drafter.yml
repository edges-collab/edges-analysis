# See https://github.com/marketplace/actions/release-drafter for configuration
categories:
  - title: ":boom: Breaking Changes"
    labels:
      - "API Breaking"
  - title: ":rocket: Features"
    labels:
      - "type: feature: ui"
      - "type: feature: physical"
  - title: ":fire: Removals and Deprecations"
    labels:
      - "type: maint: removal"
  - title: ":beetle: Fixes"
    labels:
      - "type: bug"
  - title: ":racehorse: Performance"
    labels:
      - "type: performance: memory"
      - "type: performance: cpu"
      - "type: accuracy"
  - title: ":rotating_light: Testing"
    labels:
      - "type: testing"
  - title: ":construction_worker: Continuous Integration"
    labels:
      - "type: ci"
  - title: ":books: Documentation"
    labels:
      - "type: maint: documentation"
  - title: ":hammer: Refactoring"
    labels:
      - "type: maint: refactoring"
  - title: ":lipstick: Style"
    labels:
      - "type: maint: style"
  - title: ":package: Dependencies"
    labels:
      - "type: maint: dependencies"
      - "type: maint: build"

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# This is the 8.x maintenance branch: it only gets v8-compatible bug fixes, released
# as v8 versions. Its draft and previous release are those targeting this branch, and
# only v8 tags count.
filter-by-commitish: true
filter-by-range: '^8'
# PRs that break the API belong on main (v9). This also leaves out the part of #334
# that was merged before this branch was created and is reverted here.
exclude-labels:
  - "API Breaking"

# The next version is resolved from the labels of the PRs merged since the last
# release: the highest bump wins. Fixes that change results (type: accuracy) are a
# minor bump. There are no major bumps on this branch.
version-resolver:
  minor:
    labels:
      - "type: feature: ui"
      - "type: feature: physical"
      - "type: accuracy"
      - "type: maint: removal"
  patch:
    labels:
      - "type: bug"
      - "type: performance: memory"
      - "type: performance: cpu"
      - "type: testing"
      - "type: ci"
      - "type: maint: documentation"
      - "type: maint: refactoring"
      - "type: maint: style"
      - "type: maint: dependencies"
      - "type: maint: build"
  default: patch

autolabeler:
  - label: 'type: maint: documentation'
    files:
      - '*.md'
      - '*.rst'
      - 'docs/**/*'
    branch:
      - '/.*docs{0,1}.*/'
  - label: 'type: bug'
    branch:
      - '/fix.*/'
    title:
      - '/fix/i'
  - label: "type: maint: removal"
    title:
      - "/remove .*/i"
  - label: "type: ci"
    files:
      - '.github/*'
      - '.pre-commit-config.yaml'
      - '.coveragrc'
    branch:
      - '/pre-commit-ci-update-config/'
  - label: "type: maint: style"
    files:
      - '/pre-commit-ci-update-config/'
  - label: "type: maint: refactoring"
    title:
      - "/.* refactor.*/i"

template: |
  ## Changes

  $CHANGES
