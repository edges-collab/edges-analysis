name: Update Draft Release

# Each long-lived branch keeps its own draft: main drafts the next release, and
# 8.x (the v8 maintenance branch) drafts the next v8 bug-fix release.
on:
  push:
    branches: [main, "8.x"]
permissions:
  contents: write
  pull-requests: write

jobs:
  draft-release:
    name: Update Draft Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish the release notes
        uses: release-drafter/release-drafter@v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
